<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Savvy Scanner</title>
<style>
  :root { --bg:#0d0d0d; --sf:#1a1a1a; --sf2:#232323; --bd:#2e2e2e; --tx:#f0f0f0; --mu:#888; --ac:#FF6B35; --sv:#00e676; --dw:#e74c3c; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--tx); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; }

  /* HEADER */
  .hdr { padding:40px 20px 20px; text-align:center; position:relative; }
  .logo { width:72px; height:72px; background:linear-gradient(135deg,#FF6B35,#E71D36); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 16px; box-shadow:0 8px 32px rgba(255,107,53,.3); }
  .title { font-size:28px; font-weight:900; }
  .title span { color:var(--ac); }
  .subtitle { font-size:12px; color:var(--mu); margin-top:4px; }

  /* MODULES */
  .modules { padding:8px 20px 40px; display:flex; flex-direction:column; gap:14px; max-width:420px; margin:0 auto; width:100%; }
  .mod { display:flex; align-items:center; gap:16px; background:var(--sf); border:1px solid var(--bd); border-radius:18px; padding:18px 20px; text-decoration:none; color:var(--tx); }
  .mod:active { opacity:.8; }
  .mod.products { border-left:4px solid #00e676; }
  .mod.clothing { border-left:4px solid #0064d2; }
  .mod.inventory { border-left:4px solid #ffab00; }
  .mod-icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
  .products .mod-icon { background:rgba(0,230,118,.1); }
  .clothing .mod-icon { background:rgba(0,100,210,.1); }
  .inventory .mod-icon { background:rgba(255,171,0,.1); }
  .mod-text { flex:1; }
  .mod-name { font-size:17px; font-weight:800; margin-bottom:3px; }
  .mod-desc { font-size:12px; color:var(--mu); line-height:1.4; }
  .mod-arrow { font-size:20px; color:var(--mu); }

  /* FOOTER */
  .footer { text-align:center; padding:16px; font-size:11px; color:var(--bd); margin-top:auto; }

  /* LOGIN SCREEN */
  .login-screen { display:none; position:fixed; inset:0; background:var(--bg); z-index:300; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .login-screen.show { display:flex; }
  .login-box { background:var(--sf); border:1px solid var(--bd); border-radius:20px; padding:40px 30px; max-width:360px; width:100%; }
  .login-title { font-size:24px; font-weight:900; margin-bottom:8px; text-align:center; }
  .login-subtitle { font-size:12px; color:var(--mu); text-align:center; margin-bottom:24px; }
  .login-input { width:100%; background:var(--sf2); border:1px solid var(--bd); border-radius:10px; padding:12px 14px; color:var(--tx); font-size:14px; margin-bottom:12px; outline:none; }
  .login-input::placeholder { color:var(--mu); }
  .login-btn { width:100%; padding:14px; background:linear-gradient(135deg,#FF6B35,#E71D36); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:800; cursor:pointer; }
  .login-btn:disabled { opacity:.5; cursor:not-allowed; }
  .login-error { color:var(--dw); font-size:12px; margin-top:12px; text-align:center; display:none; }
  .login-staging { position:absolute; top:16px; left:16px; background:rgba(255,107,53,.2); border:1px solid var(--ac); border-radius:8px; padding:6px 12px; font-size:11px; font-weight:700; color:var(--ac); }

  /* HEADER LOGGED IN */
  .hdr-user { position:absolute; top:16px; right:16px; font-size:12px; color:var(--mu); }
  .hdr-logout { background:var(--dw); color:white; border:none; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; margin-left:12px; }

</style>
</head>
<body>

<!-- LOGIN SCREEN (STAGING) -->
<div class="login-screen show" id="login-screen">
  <div class="login-staging">🧪 STAGING</div>
  <div class="login-box">
    <div class="login-title"><span style="color:var(--ac)">Savvy</span> Login</div>
    <div class="login-subtitle">Central authentication pilot</div>
    <input class="login-input" id="login-user" type="text" placeholder="Usuario" autocomplete="username">
    <input class="login-input" id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="login-btn" id="login-btn" onclick="savvyLogin()">Ingresar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="hdr">
  <div class="hdr-staging" style="position:absolute;top:16px;left:16px;background:rgba(255,107,53,.2);border:1px solid var(--ac);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;color:var(--ac);">🧪 STAGING</div>
  <div class="logo">🛒</div>
  <div class="title"><span>Savvy</span> Scanner</div>
  <div class="subtitle">powered by Robles · DWI</div>
  <div class="hdr-user" id="hdr-user" style="display:none;">
    <span id="hdr-username"></span>
    <button class="hdr-logout" onclick="savvyLogout()">🚪 Salir</button>
  </div>
</div>

<div class="modules" id="modules" style="display:none;">
  <a href="https://octavio-cmd.github.io/product-scanner-staging/" class="mod products">
    <div class="mod-icon">📦</div>
    <div class="mod-text">
      <div class="mod-name">Product Scanner</div>
      <div class="mod-desc">Abrir módulo</div>
    </div>
    <div class="mod-arrow">→</div>
  </a>
  <div class="mod clothing" style="opacity:.5; cursor:not-allowed;">
    <div class="mod-icon">👕</div>
    <div class="mod-text">
      <div class="mod-name">Clothing & Shoes</div>
      <div class="mod-desc">🧪 Próximamente en staging</div>
    </div>
    <div class="mod-arrow">⏸</div>
  </div>
  <a href="https://octavio-cmd.github.io/inventory-manager-staging/" class="mod inventory">
    <div class="mod-icon">📊</div>
    <div class="mod-text">
      <div class="mod-name">Inventory</div>
      <div class="mod-desc">Abrir módulo</div>
    </div>
    <div class="mod-arrow">→</div>
  </a>
</div>

<div class="footer">Savvy Scanner v3.0 · Discount Wholesalers Inc.</div>

<script>
// ── SAVVY CENTRAL LOGIN (STAGING PILOT) ──────────────────────────────
const SAVVY_API = 'https://ample-imagination-clothing-staging.up.railway.app';

// Función de inicialización
function initSession() {
  const token = sessionStorage.getItem('savvy_session_token');
  const user = sessionStorage.getItem('savvy_session_user');

  if (token && user) {
    // Usuario autenticado
    document.getElementById('login-screen').classList.remove('show');
    document.getElementById('modules').style.display = 'flex';
    document.getElementById('hdr-user').style.display = 'block';
    document.getElementById('hdr-username').textContent = '👤 ' + user;
  } else {
    // Sin autenticación
    document.getElementById('login-screen').classList.add('show');
    document.getElementById('modules').style.display = 'none';
    document.getElementById('hdr-user').style.display = 'none';
  }
}

// Login central
async function savvyLogin() {
  const userEl = document.getElementById('login-user');
  const passEl = document.getElementById('login-pass');
  const btnEl = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');

  const usuario = userEl.value.trim();
  const password = passEl.value;

  if (!usuario || !password) {
    errEl.textContent = '❌ Usuario y contraseña requeridos';
    errEl.style.display = 'block';
    return;
  }

  btnEl.disabled = true;
  btnEl.textContent = '⏳ Entrando...';
  errEl.style.display = 'none';

  try {
    const response = await fetch(SAVVY_API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario: usuario, password: password })
    });

    if (response.ok) {
      const data = await response.json();
      if (data && data.token) {
        // Guardar sesión (NO contraseña)
        sessionStorage.setItem('savvy_session_token', data.token);
        sessionStorage.setItem('savvy_session_user', data.usuario || usuario);

        // Limpiar contraseña ANTES de reiniciar UI
        passEl.value = '';

        // Mostrar UI de autenticado
        initSession();
      } else {
        errEl.textContent = '❌ Respuesta inválida del servidor';
        errEl.style.display = 'block';
      }
    } else {
      errEl.textContent = '❌ Usuario o contraseña incorrectos';
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = '❌ Error de conexión: ' + e.message;
    errEl.style.display = 'block';
  } finally {
    // SIEMPRE limpiar password (type=password y variable)
    passEl.value = '';
    btnEl.disabled = false;
    btnEl.textContent = 'Ingresar';
  }
}

// Logout coordinado
function savvyLogout() {
  // Limpiar SOLO Savvy session
  sessionStorage.removeItem('savvy_session_token');
  sessionStorage.removeItem('savvy_session_user');

  // Mostrar login inmediatamente
  initSession();
}

// Inicializar al cargar
window.addEventListener('DOMContentLoaded', initSession);
</script>
</body>
</html>
